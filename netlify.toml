# Netlify settings for Fuelup. Netlify reads this on every deploy.

[build]
  # The site has no build step; this only runs the safety check.
  # If the check fails, the deploy stops and the live site stays as it was.
  command = "node scripts/check.mjs"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # Bundle the fleet function together with the game engine it imports.
  node_bundler = "esbuild"

# The question bank shows every answer, so it's only for us (open it locally).
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
